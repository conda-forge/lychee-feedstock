# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.24.2"

package:
  name: lychee
  version: ${{ version }}

source:
  url: https://github.com/lycheeverse/lychee/archive/refs/tags/lychee-v${{ version }}.tar.gz
  sha256: 62687c0a84ceec76d17e30e494dcf8e65c7099a2e24a6a521a41854b8eb3759d

build:
  number: 1
  skip: ppc64le
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - cargo auditable install --bins --locked --no-track --profile=release --path=lychee-bin --root="${{ '${PREFIX}' if unix else '%LIBRARY_PREFIX%' }}"
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      - if: build_platform == target_platform
        then:
          - if: unix
            then:
              - mkdir -p "${PREFIX}/share/bash-completion/completions" "${PREFIX}/share/elvish/lib" "${PREFIX}/share/fish/vendor_completions.d" "${PREFIX}/share/powershell/completions" "${PREFIX}/share/zsh/site-functions"
              - lychee --generate complete-bash       > "${PREFIX}/share/bash-completion/completions/lychee"
              - lychee --generate complete-elvish     > "${PREFIX}/share/elvish/lib/lychee.elv"
              - lychee --generate complete-fish       > "${PREFIX}/share/fish/vendor_completions.d/lychee.fish"
              - lychee --generate complete-powershell > "${PREFIX}/share/powershell/completions/lychee.ps1"
              - lychee --generate complete-zsh        > "${PREFIX}/share/zsh/site-functions/_lychee"
            else:
              - md "%LIBRARY_PREFIX%\share\bash-completion\completions" "%LIBRARY_PREFIX%\share\elvish\lib" "%LIBRARY_PREFIX%\share\fish\vendor_completions.d" "%LIBRARY_PREFIX%\share\powershell\completions" "%LIBRARY_PREFIX%\share\zsh\site-functions"
              - lychee --generate complete-bash       > "%LIBRARY_PREFIX%\share\bash-completion\completions\lychee"
              - lychee --generate complete-elvish     > "%LIBRARY_PREFIX%\share\elvish\lib\lychee.elv"
              - lychee --generate complete-fish       > "%LIBRARY_PREFIX%\share\fish\vendor_completions.d\lychee.fish"
              - lychee --generate complete-powershell > "%LIBRARY_PREFIX%\share\powershell\completions\lychee.ps1"
              - lychee --generate complete-zsh        > "%LIBRARY_PREFIX%\share\zsh\site-functions\_lychee"

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - pkg-config

tests:
  - package_contents:
      strict: true
      bin:
        - lychee
      files:
        - if: build_platform == target_platform
          then:
            - ${{ 'Library/' if win }}share/bash-completion/completions/lychee
            - ${{ 'Library/' if win }}share/elvish/lib/lychee.elv
            - ${{ 'Library/' if win }}share/fish/vendor_completions.d/lychee.fish
            - ${{ 'Library/' if win }}share/powershell/completions/lychee.ps1
            - ${{ 'Library/' if win }}share/zsh/site-functions/_lychee
  - script:
      - lychee --help
      - lychee --version
      - lychee --version | ${{ 'grep -iE ' if unix else 'findstr /r /c:' }}${{ version | replace('.', '\\.') }}


about:
  license: Apache-2.0 OR MIT
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  summary: Fast, async, resource-friendly link checker
  description: |
    Finds broken URLs and mail addresses inside Markdown, HTML,
    reStructuredText, websites and more!

  homepage: https://lychee.cli.rs
  repository: https://github.com/lycheeverse/lychee
  documentation: https://lychee.cli.rs/introduction

extra:
  recipe-maintainers:
    - danielnachun
    - egpbos
